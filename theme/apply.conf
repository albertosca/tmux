# Styles that tmux expands once, when they are set (-gF). Sourced by tmux.conf
# right after the gravel-<mode>.conf colors, and again by switch.sh, so a mode
# switch repaints them too. No color is typed here: only @gravel-* options.
set -gF pane-border-style "fg=#{@gravel-faint}"
set -gF pane-active-border-style "fg=#{@gravel-muted}"
set -gF status-style "bg=#{@gravel-ground},fg=#{@gravel-ink}"
set -gF message-style "fg=#{@gravel-ink},bg=#{@gravel-surface}"
set -gF message-command-style "fg=#{@gravel-ink},bg=#{@gravel-surface}"
setw -gF mode-style "fg=#{@gravel-ink},bg=#{@gravel-faint}"
setw -gF clock-mode-colour "#{@gravel-muted}"
