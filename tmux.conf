################
# KEY BINDINGS #
################

# use C-a, since it's on the home row and easier to hit than C-b
set-option -g prefix C-a
unbind-key C-a
bind-key C-a send-prefix
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Open tmuxs new panel in the same path it currently is
bind c new-window -c "#{pane_current_path}"

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on
# Don't let programs rename the window via escape sequences after you named it
set-option -g allow-rename off

set -g history-limit 50000

# Pin the native arm64 wrapper by absolute path. Without this, tmux-sensible
# auto-sets default-command with whichever reattach-to-user-namespace the
# server's PATH finds first — a server inherited from a stale shell resolved
# the Intel one, silently forcing every pane (and everything inside) under
# Rosetta even though the tmux server itself was native.
#
# Guarded by if-shell: an unguarded absolute path kills EVERY pane with exit
# 127 on any host without that exact binary (Intel mac, Linux, fresh clone).
# When the guard fails the option stays unset and tmux-sensible's own
# command_exists check also declines it, so the default shell is used.
if-shell '[ -x /opt/homebrew/bin/reattach-to-user-namespace ]' \
  'set -g default-command "/opt/homebrew/bin/reattach-to-user-namespace -l /bin/zsh"'

setw -g mode-keys vi
set -g mouse on
set -g focus-events on

# Repassa sequências de teclas estendidas (Ctrl+Arrow, etc.) pro programa
# dentro do pane (readline no shell, vim) em vez de descartar/interceptar.
# Sem isso, Ctrl+Arrow (pular palavra) não funciona via SSH mobile mesmo
# com o teclado do cliente configurado certo do lado do celular.
set -s extended-keys on
# Resize a pane to smallest client only if that client is actively viewing the window
set -g aggressive-resize on

# Copy-mode vi: seleção estilo vim + yank pro clipboard do macOS
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'

bind-key '\' split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Mover janela atual para esquerda/direita (repetível)
bind-key -r < swap-window -t -1\; select-window -t -1
bind-key -r > swap-window -t +1\; select-window -t +1

# base-index=1 → 0 não existe; mapeia pra janela 10
bind-key 0 select-window -t :10

# Renomear sessão sem Shift (alternativa a prefix+$)
bind-key e command-prompt -I "#S" "rename-session -- '%%'"

bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r H resize-pane -L 5
bind-key -r L resize-pane -R 5

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Reload tmux config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# vim-tmux-navigator se apossa de C-l (limpar tela). Restaura via prefix + C-l.
bind C-l send-keys 'C-l'

# Popups flutuantes (tmux 3.2+)
bind-key C display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "claude"
bind-key G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind-key T display-popup -E -w 80% -h 75% -d "#{pane_current_path}"

# Temas por sessão — ciano pra work*, laranja pra personal*
set-hook -g session-created 'run-shell "~/.config/tmux/scripts/session-theme.sh \"#S\""'
set-hook -g client-session-changed 'run-shell "~/.config/tmux/scripts/session-theme.sh \"#S\""'
set-hook -g session-renamed 'run-shell "~/.config/tmux/scripts/session-theme.sh \"#S\""'

# Marca manual da window (indicador de pendência do Claude) — toggle entre
# base e "eu marquei". Sobreposta pela cor automática do Claude quando ele
# está esperando; reaparece sozinha quando a pendência é resolvida.
# O guard test -f mantém o binding inofensivo em máquinas sem o hook
# (este conf é publicado como está em github.com/albertosca/tmux).
bind-key m run-shell "test -f ~/.claude/hooks/tmux-pending.sh && bash ~/.claude/hooks/tmux-pending.sh mark '#{pane_id}' || true"
# pane-active-border-style global vaza ao criar pane — re-aplica o tema da sessão imediatamente
set-hook -g after-split-window 'run-shell "~/.config/tmux/scripts/session-theme.sh \"#S\""'

# Cria/mata/move/troca window muda quem é vizinho de quem — a seta esquerda
# de uma aba colorida usa a cor da vizinha ANTERIOR (26/08/2026), então
# topologia muda a pintura mesmo sem nenhuma pendência ter mudado de estado.
# window-linked/window-unlinked disparam nas quatro operações (confirmado
# rodando: new-window, kill-window, move-window E swap-window — os únicos
# dois nomes de hook que existem pra isso no tmux 3.7c; after-move-window e
# after-swap-window não existem). repaint-all já reprocessa toda window com
# estado, recalculando vizinhos ao vivo — não precisa de subcomando novo.
#
# Ligado em 27/08/2026 com aprovação do Alberto, depois de contido o
# incidente que os desligou: por serem GLOBAIS, disparam pra QUALQUER sessão
# do Claude na máquina — outra sessão rodando uma suíte em background gerou
# ~20 chamadas em 24s, e sob essa carga `tmux list-windows -a` FALHOU; o
# código lia a falha como "nenhuma window existe" e apagou marcas reais.
# Três contenções desde então, todas com teste: debounce de 1/s, falha de
# consulta nunca mais tratada como lista vazia, e — a que mais importa —
# repaint-all não apaga NADA (a varredura destrutiva mora só no caminho de
# migração de formato, que roda ~1x por deploy).
set-hook -g window-linked "run-shell \"test -f ~/.claude/hooks/tmux-pending.sh && bash ~/.claude/hooks/tmux-pending.sh repaint-all || true\""
set-hook -g window-unlinked "run-shell \"test -f ~/.claude/hooks/tmux-pending.sh && bash ~/.claude/hooks/tmux-pending.sh repaint-all || true\""

# Aba roxa olhada por 2s+ e depois deixada = vista, apaga (23/09/2026).
# session-window-changed entrega a sessão e a aba NOVA (medido no 3.7c;
# selecionar a mesma aba não dispara); o hook lembra qual foi deixada.
# client-session-changed[1] só reinicia a contagem ao voltar pra uma sessão —
# o índice 0 é o tema, definido acima.
set-hook -g session-window-changed "run-shell \"test -f ~/.claude/hooks/tmux-pending.sh && bash ~/.claude/hooks/tmux-pending.sh window-changed '#{session_id}' '#{window_id}' || true\""
set-hook -g 'client-session-changed[1]' "run-shell \"test -f ~/.claude/hooks/tmux-pending.sh && bash ~/.claude/hooks/tmux-pending.sh window-changed '#{session_id}' '#{window_id}' || true\""

##################
# DESIGN CHANGES #
##################

# panes
set -g pane-border-style fg=colour238,bg=colour235
set -g pane-active-border-style fg=colour244,bg=colour236

# Status bar
## Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

## Status bar design
# status line
set -g status-justify left
set -g status-bg black
set -g status-fg colour12
set -g status-interval 2

set -g status-position bottom
set -g status-left ' #(tmux ls -F "##{?session_attached,#[fg=colour255]#[bold]##S#[nobold]#[fg=colour245],#[fg=colour245]##S}" 2>/dev/null | awk "NR>1{printf \" • \"}{printf \"%%s\",\$0}")#[fg=colour255] │ '
set -g status-right '#[fg=colour252,bg=colour236] #(cd #{pane_current_path} && git rev-parse --abbrev-ref HEAD 2>/dev/null) #[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 80
set -g status-left-length 60

# messaging
set -g message-style fg=black,bg=yellow
set -g message-command-style fg=blue,bg=black

#window mode
setw -g mode-style fg=colour0,bg=colour6

# window status
# Sem separador entre abas (o default do tmux é um espaço). O espaço é
# pintado com o fundo da BARRA, então ele cortava qualquer conexão entre
# abas coloridas: a cunha de uma aba nunca encostava na seguinte, e duas
# abas da mesma cor viravam retângulos soltos com um buraco laranja no
# meio (medido lendo a barra renderizada em 26/08/2026). O padding de cada
# aba já vem do próprio formato dela, então nada fica grudado.
set -g window-status-separator ''

# Formatos ÚNICOS e dinâmicos: a cor resolve no render pelo nome da sessão
# (mesma convenção do session-theme.sh — work*=ciano, personal*=laranja,
# resto=preto/cinza). Antes cada sessão tinha formato próprio aplicado
# window a window pelo session-theme.sh, e qualquer `setw -u` de terceiros
# (ex.: o indicador de pendência do Claude ao limpar) derrubava a window no
# formato global cinza — foi a causa das "windows cinzas" de 25/08/2026.
# Com o global já dinâmico, não existe mais escrita por window pra colidir,
# e o negativo das setas ⮀ sai sempre na cor da barra da sessão.
setw -g window-status-format "#[fg=#{?#{||:#{m:work*,#S},#{m:personal*,#S}},colour255,colour244}] #I #[fg=#{?#{||:#{m:work*,#S},#{m:personal*,#S}},colour255,colour252}] #W "
setw -g window-status-current-format "#[fg=#{?#{m:work*,#S},colour31,#{?#{m:personal*,#S},colour130,black}},bg=#{?#{m:work*,#S},colour51,#{?#{m:personal*,#S},colour172,colour244}}]⮀#[fg=#{?#{||:#{m:work*,#S},#{m:personal*,#S}},colour255,colour232},bg=#{?#{m:work*,#S},colour51,#{?#{m:personal*,#S},colour172,colour244}},bold] #I ⮁ #W #[fg=#{?#{m:work*,#S},colour51,#{?#{m:personal*,#S},colour172,colour244}},bg=#{?#{m:work*,#S},colour31,#{?#{m:personal*,#S},colour130,black}}]⮀"

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
# Undercurl colorido (CoC.nvim diagnostics, LSP, etc.)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# The modes {
setw -g clock-mode-colour colour135

###########
# PLUGINS #
###########

# Keep all plugins under ~/.config/tmux/plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

# Auto installs tpm
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'omerxx/tmux-sessionx'

# Tmux ressurrect
set -g @resurrect-strategy-vim 'session'

# Tmux continuum — auto-save sessions every 15min
set -g @continuum-restore 'on'

# Tmux yank
set -g @shell_mode 'vi'

# Tmux open
set -g @open 'C-o'
set -g @open-editor 'o'

# Tmux sessionx — fuzzy session switcher (prefix + O)
set -g @sessionx-bind 'O'
set -g @sessionx-window-mode 'on'
set -g @sessionx-preview-enabled 'true'

# Extrakto — fuzzy grab de paths/urls/hashes do pane (prefix + Tab)
set -g @extrakto_key 'Tab'
set -g @extrakto_default_opt 'word'
set -g @extrakto_clip_tool 'pbcopy'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# ── Post-TPM overrides ──────────────────────────────────────────────────────
# tmux-sensible força unconditionally `status-keys emacs` — sobrescrevemos aqui.
set -g status-keys vi
